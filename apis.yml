aid: neko-health
name: Neko Health
description: >-
  Neko Health is a Swedish preventive-healthcare company founded in 2018 by
  Daniel Ek and Hjalmar Nilsonne. It designs, engineers, and assembles its own
  full-body scanning hardware in Stockholm and operates clinics across Sweden, the
  UK (London, Manchester, Birmingham) and, following a $700M Series C, the United
  States. The roughly 60-minute Neko Health Scan is a non-invasive, radiation-free
  examination that captures millions of data points across the skin, heart, blood,
  and circulation in a single visit, feeding a consumer patient app. Neko exposes
  no public third-party developer API; its only public machine surface is a Duende
  IdentityServer OIDC provider (account.nekohealth.com) that authenticates the
  patient application. This profile was surfaced as a venture-portfolio lead and
  enriched from Neko's public web and identity surface.
